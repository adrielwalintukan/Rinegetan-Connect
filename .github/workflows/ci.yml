name: Continuous Integration

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  frontend-quality-gate:
    name: Frontend Quality Gate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
      # Route contract test reads .next/server/app-paths-manifest.json, so it must run after the build.
      - name: Unit, contract & security tests
        run: npm run test:routes

  database-quality-gate:
    name: Database pgTAP & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start Supabase local containers
        run: supabase start
      - name: Run pgTAP test suites
        run: supabase test db

  # Suite selection and triggers agreed for QA-CI-E2E (#73); see docs/06-quality/TEST-STRATEGY.md.
  browser-regression:
    name: Browser regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CONTAINER_RUNTIME: docker
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Supabase local containers
        # Only the services the app and fixtures use: Postgres, Auth, PostgREST, Storage and the gateway.
        # stdout is discarded because it prints the local CLI key table; errors still reach stderr.
        run: npm run supabase -- start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta > /dev/null
      - name: Export local Supabase settings
        # Loopback URL and the local CLI anon key only; written to the job env without printing them.
        run: |
          npm run --silent supabase -- status -o json > "$RUNNER_TEMP/supabase-status.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase-status.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/supabase-status.json")"
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase-status.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase-status.json"
      - name: Build production bundle
        id: build
        run: npm run build
      # Each suite runs even when an earlier one fails, so every result is visible on the PR.
      - name: Public routes (overflow, mobile navigation, skip link)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The home screenshot baseline exists only for Windows, so it stays a local check.
        run: npx playwright test tests/visual/public-routes.spec.ts --grep-invert "visual baseline"
      - name: Accessibility audit (axe WCAG 2.2 AA, headings, focus, reduced motion)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The performance snapshot is only meaningful against production.
        run: npm run test:a11y -- --grep-invert performance
        env:
          AUDIT_START_SERVER: "1"
      - name: Bible reader flows (anonymous, local progress, withdrawal)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test -c tests/visual/bible-reader.config.ts
      - name: Staff course CMS flows (Admin/Editor, forms, mobile, keyboard)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test -c tests/visual/staff-courses.config.ts
      - name: Upload browser artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Rulesets cannot restrict a PR's source branch, so main requires this check instead (OPS-GIT #69).
  release-source:
    name: Release source branch
    runs-on: ubuntu-latest
    steps:
      - name: Require development of this repository as the source of pull requests into main
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != development ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull request ke main hanya boleh dari branch development repository ini."
            exit 1
          fi

  backend-syntax:
    name: Backend syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile backend
        run: python -m compileall -q server.py
